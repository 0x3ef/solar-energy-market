[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-iot"
version = "0.1.0"
description = "Solar Energy Market IoT simulator and gRPC/MQTT gateway"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.62",
    "protobuf>=5.26",
    "paho-mqtt>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.62",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.5",
]

[project.scripts]
solar-iot-simulator = "simulator.main:main"
solar-iot-gateway = "gateway.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "grpc_client*",
    "models*",
    "config*",
    "generators*",
    "publishers*",
    "schemas*",
    "gateway*",
    "simulator*",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["grpc_client/sensor_pb2.py", "grpc_client/sensor_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "grpc_client",
    "models",
    "config",
    "generators",
    "publishers",
    "schemas",
    "gateway",
    "simulator",
]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_unimported = false
ignore_missing_imports = true
exclude = ["^grpc_client/", "^tests/"]

[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grpc_client.*", "tests.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["paho.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests that require a real broker or network"]
