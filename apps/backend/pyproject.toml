[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-market-backend"
version = "0.1.0"
description = "Solar Energy Market — backend (FastAPI + MQTT ingest + PostgreSQL)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "paho-mqtt>=2.1",
    "web3>=7.0,<8.0",
    "eth-account>=0.13",
    "hexbytes>=1.2",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "alembic>=1.13",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.11",
    "grpcio-tools>=1.62",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/**/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = [
    "tests",
    "^app/iot/",
    "^app/blockchain/",
    "^app/api/v1/endpoints/",
]

[[tool.mypy.overrides]]
module = [
    "app.*",
    "app.blockchain.*",
    "app.iot.*",
    "app.api.v1.endpoints.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
asyncio_mode = "auto"
markers = ["integration: tests requiring a live broker or DB"]