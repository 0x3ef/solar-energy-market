name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, type-check, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest --cov-fail-under=0

  backend-integration:
    name: Backend PostgreSQL integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose -f infrastructure/docker/docker-compose.yml up -d timescaledb migrator
      - run: docker compose -f infrastructure/docker/docker-compose.yml run --rm tests pytest -m integration -q --cov-fail-under=0
      - if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v

  iot:
    name: IoT lint, type-check, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iot/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: make protos
      - run: ruff check .
      - run: mypy .
      - run: pytest -m "not integration" --cov-fail-under=0

  iot-integration:
    name: IoT gateway and MQTT integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: iot/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: make protos
      - name: Start broker and gateway
        working-directory: .
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d mosquitto gateway
      - run: pytest -m integration -q --cov-fail-under=0
      - name: Show gateway logs on failure
        if: failure()
        working-directory: .
        run: docker compose -f infrastructure/docker/docker-compose.yml logs gateway mosquitto
      - name: Stop integration services
        if: always()
        working-directory: .
        run: docker compose -f infrastructure/docker/docker-compose.yml down

  contracts:
    name: Solidity tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - working-directory: contracts
        run: forge test
      - working-directory: contracts
        run: forge build

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infrastructure/docker/docker-compose.yml config --quiet
