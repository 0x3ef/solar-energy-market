name: solar-energy-market

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  iot:
    driver: bridge
  backend:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mosquitto_data:
  timescale_data:
  anvil_data:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:
  # =========================================================================
  # MQTT broker
  # =========================================================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: solar-mosquitto
    restart: unless-stopped
    networks: [iot]
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # =========================================================================
  # TimescaleDB
  # =========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: solar-timescaledb
    restart: unless-stopped
    networks: [backend]
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solar}
      POSTGRES_DB: ${POSTGRES_DB:-solar}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-solar} -d ${POSTGRES_DB:-solar}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # =========================================================================
  # Local EVM chain
  # =========================================================================
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: solar-anvil
    restart: unless-stopped
    networks: [backend]
    ports: ["8545:8545"]
    entrypoint:
      - anvil
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
    volumes:
      - anvil_data:/root/.foundry
    healthcheck:
      test:
        - CMD-SHELL
        - cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # =========================================================================
  # gRPC gateway
  # =========================================================================
  gateway:
    build:
      context: ../../iot
      target: gateway
    container_name: solar-gateway
    restart: unless-stopped
    networks: [iot]
    depends_on:
      mosquitto:
        condition: service_healthy
    ports: ["50051:50051"]
    environment:
      PUBLISHER: mqtt
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_CLIENT_ID: solar-gateway
      GRPC_PORT: "50051"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; socket.create_connection(('127.0.0.1', 50051), timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # =========================================================================
  # Simulator
  # =========================================================================
  simulator:
    build:
      context: ../../iot
      target: simulator
    container_name: solar-simulator
    restart: unless-stopped
    networks: [iot]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      USE_GRPC: "true"
      GATEWAY_ADDRESS: gateway:50051
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # =========================================================================
  # Backend API (Chalice)
  # =========================================================================
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
      target: api
    container_name: solar-api
    restart: unless-stopped
    networks: [backend]
    depends_on:
      timescaledb:
        condition: service_healthy
      anvil:
        condition: service_healthy
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-solar}:${POSTGRES_PASSWORD:-solar}@timescaledb:5432/${POSTGRES_DB:-solar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB3_PROVIDER_URL: http://anvil:8545
      SUN_TOKEN_ADDRESS: ${SUN_TOKEN_ADDRESS:-}
      ENERGY_MARKET_ADDRESS: ${ENERGY_MARKET_ADDRESS:-}
      REDEMPTION_MANAGER_ADDRESS: ${REDEMPTION_MANAGER_ADDRESS:-}
      BACKEND_PRIVATE_KEY: ${BACKEND_PRIVATE_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}

  # =========================================================================
  # MQTT ingest worker
  # =========================================================================
  subscriber:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
      target: subscriber
    container_name: solar-subscriber
    restart: unless-stopped
    networks: [iot, backend]
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-solar}:${POSTGRES_PASSWORD:-solar}@timescaledb:5432/${POSTGRES_DB:-solar}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: "solar/#"
      MQTT_CLIENT_ID: solar-subscriber
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB3_PROVIDER_URL: http://anvil:8545
      SUN_TOKEN_ADDRESS: ${SUN_TOKEN_ADDRESS:-}
      ENERGY_MARKET_ADDRESS: ${ENERGY_MARKET_ADDRESS:-}
      REDEMPTION_MANAGER_ADDRESS: ${REDEMPTION_MANAGER_ADDRESS:-}
      BACKEND_PRIVATE_KEY: ${BACKEND_PRIVATE_KEY:-}

  # =========================================================================
  # Test runner (profile: test)
  # =========================================================================
  tests:
    profiles: ["test"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
      target: tests
    networks: [iot, backend]
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-solar}:${POSTGRES_PASSWORD:-solar}@timescaledb:5432/${POSTGRES_DB:-solar}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      LOG_LEVEL: WARNING
    command: ["-m", "not integration"]