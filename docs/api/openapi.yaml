openapi: 3.1.0
info:
  title: Solar Energy Market API
  version: 0.1.0
  description: |
    HTTP API exposed by `apps/backend` (Chalice). All endpoints are
    prefixed with `/api/v1`. The API is intentionally synchronous at
    the HTTP level but every handler runs on an asyncio event loop, so
    concurrent requests are safe.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development (docker compose)
tags:
  - name: system
    description: Health and metadata
  - name: users
    description: User registration and wallet linking
  - name: homes
    description: Homes and their devices
  - name: devices
    description: Device registration
  - name: energy
    description: Telemetry reads and interval aggregation
  - name: marketplace
    description: SUN token orders and trades
  - name: redemptions
    description: SUN token redemption
paths:

  # ===========================================================================
  # System
  # ===========================================================================
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ===========================================================================
  # Users
  # ===========================================================================
  /users:
    post:
      tags: [users]
      summary: Register a user
      description: Creates a user, hashes the password with bcrypt and
        returns a signed JWT the client can use in `Authorization` headers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
        '400':
          description: Validation error
        '500':
          description: Internal error

  /users/{user_id}:
    get:
      tags: [users]
      summary: Return a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /users/{user_id}/wallets:
    get:
      tags: [users]
      summary: List a user's wallets
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: List of wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wallet'
    post:
      tags: [users]
      summary: Link an EVM wallet to a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletCreate'
      responses:
        '200':
          description: Wallet linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          description: Invalid address or chain id

  # ===========================================================================
  # Homes
  # ===========================================================================
  /homes:
    post:
      tags: [homes]
      summary: Register a home
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeCreate'
      responses:
        '200':
          description: Home created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'

  /homes/{home_id}:
    get:
      tags: [homes]
      summary: Return a home
      parameters:
        - $ref: '#/components/parameters/HomeId'
      responses:
        '200':
          description: Home found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
        '404':
          description: Home not found

  /homes/{home_id}/devices:
    get:
      tags: [homes]
      summary: List the devices of a home
      parameters:
        - $ref: '#/components/parameters/HomeId'
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'

  # ===========================================================================
  # Devices
  # ===========================================================================
  /devices:
    post:
      tags: [devices]
      summary: Register a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
      responses:
        '200':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /devices/{device_code}:
    get:
      tags: [devices]
      summary: Return a device by code
      parameters:
        - name: device_code
          in: path
          required: true
          schema:
            type: string
            example: SM-CALI-001-001
      responses:
        '200':
          description: Device found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          description: Device not found

  # ===========================================================================
  # Energy
  # ===========================================================================
  /homes/{home_id}/energy/latest:
    get:
      tags: [energy]
      summary: Latest telemetry per device
      parameters:
        - $ref: '#/components/parameters/HomeId'
      responses:
        '200':
          description: Latest readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LatestReading'

  /homes/{home_id}/energy/summary:
    get:
      tags: [energy]
      summary: 24-hour aggregated summary
      parameters:
        - $ref: '#/components/parameters/HomeId'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergySummary'

  /homes/{home_id}/energy/intervals:
    get:
      tags: [energy]
      summary: Recent aggregated intervals
      parameters:
        - $ref: '#/components/parameters/HomeId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Intervals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnergyInterval'

  /energy/aggregate:
    post:
      tags: [energy]
      summary: Trigger an explicit aggregation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregateRequest'
      responses:
        '200':
          description: Created interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergyInterval'

  # ===========================================================================
  # Marketplace
  # ===========================================================================
  /marketplace/orders:
    post:
      tags: [marketplace]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    get:
      tags: [marketplace]
      summary: List open orders
      parameters:
        - name: order_type
          in: query
          schema:
            type: string
            enum: [sell, buy]
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /marketplace/orders/{order_id}:
    get:
      tags: [marketplace]
      summary: Return one order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

  /marketplace/orders/{order_id}/cancel:
    post:
      tags: [marketplace]
      summary: Cancel an open order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /marketplace/fill:
    post:
      tags: [marketplace]
      summary: Fill the best available sell orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillRequest'
      responses:
        '200':
          description: Created trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'

  # ===========================================================================
  # Redemptions
  # ===========================================================================
  /redemptions:
    post:
      tags: [redemptions]
      summary: Request a redemption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionCreate'
      responses:
        '200':
          description: Redemption created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'

  /users/{user_id}/redemptions:
    get:
      tags: [redemptions]
      summary: List a user's redemptions
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Redemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Redemption'

  /redemptions/{redemption_id}/approve:
    post:
      tags: [redemptions]
      summary: Approve a pending redemption
      parameters:
        - name: redemption_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved redemption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'

  /redemptions/{redemption_id}/complete:
    post:
      tags: [redemptions]
      summary: Mark a redemption as completed
      parameters:
        - name: redemption_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Completed redemption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'

components:

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HomeId:
      name: home_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    # -------------------------------------------------------------------------
    # Users
    # -------------------------------------------------------------------------
    UserCreate:
      type: object
      required: [email, full_name, password]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 8
          maxLength: 128

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        status:
          type: string
          enum: [active, suspended, pending]
        created_at:
          type: string
          format: date-time

    WalletCreate:
      type: object
      required: [address, chain_id]
      properties:
        address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        chain_id:
          type: integer
          minimum: 1

    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        address:
          type: string
        chain_id:
          type: integer
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Homes
    # -------------------------------------------------------------------------
    HomeCreate:
      type: object
      required: [owner_id, name, installed_capacity_w]
      properties:
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        country:
          type: string
          default: Colombia
        timezone:
          type: string
          default: America/Bogota
        installed_capacity_w:
          type: integer
          minimum: 1
        has_battery:
          type: boolean
          default: false

    Home:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        country:
          type: string
        timezone:
          type: string
        installed_capacity_w:
          type: integer
        has_battery:
          type: boolean
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Devices
    # -------------------------------------------------------------------------
    DeviceCreate:
      type: object
      required: [home_id, device_code, device_type]
      properties:
        home_id:
          type: string
          format: uuid
        device_code:
          type: string
          minLength: 1
          maxLength: 100
        device_type:
          type: string
          enum: [smart_meter, solar_inverter, weather_sensor, battery_monitor]
        manufacturer:
          type: string
        model:
          type: string
        serial_number:
          type: string
        installation_date:
          type: string
          format: date

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        home_id:
          type: string
          format: uuid
        device_code:
          type: string
        device_type:
          type: string
        status:
          type: string
          enum: [active, inactive, maintenance, offline]
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Energy
    # -------------------------------------------------------------------------
    LatestReading:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        sequence_number:
          type: integer
          format: int64
        measured_at:
          type: string
          format: date-time
        sensor_type:
          type: string
        data:
          type: object
          additionalProperties: true

    EnergySummary:
      type: object
      properties:
        home_id:
          type: string
          format: uuid
        window_hours:
          type: integer
          example: 24
        generation_wh:
          type: number
          format: double
        consumption_wh:
          type: number
          format: double
        grid_import_wh:
          type: number
          format: double
        grid_export_wh:
          type: number
          format: double
        eligible_export_wh:
          type: number
          format: double

    EnergyInterval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        home_id:
          type: string
          format: uuid
        interval_start:
          type: string
          format: date-time
        interval_end:
          type: string
          format: date-time
        generation_wh:
          type: integer
          format: int64
        consumption_wh:
          type: integer
          format: int64
        grid_import_wh:
          type: integer
          format: int64
        grid_export_wh:
          type: integer
          format: int64
        battery_charge_wh:
          type: integer
          format: int64
        battery_discharge_wh:
          type: integer
          format: int64
        eligible_export_wh:
          type: integer
          format: int64
        calculation_version:
          type: string
        quality_status:
          type: string
          enum: [pending, valid, rejected, review]

    AggregateRequest:
      type: object
      required: [home_id, start, end]
      properties:
        home_id:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Marketplace
    # -------------------------------------------------------------------------
    OrderCreate:
      type: object
      required: [seller_id, order_type, token_amount, price_per_token]
      properties:
        seller_id:
          type: string
          format: uuid
        order_type:
          type: string
          enum: [sell, buy]
        token_amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        price_per_token:
          type: number
          minimum: 0
          exclusiveMinimum: true

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        order_type:
          type: string
          enum: [sell, buy]
        token_amount:
          type: number
        price_per_token:
          type: number
        remaining_amount:
          type: number
        status:
          type: string
          enum: [open, partial, filled, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FillRequest:
      type: object
      required: [buyer_id, token_amount]
      properties:
        buyer_id:
          type: string
          format: uuid
        token_amount:
          type: number
          minimum: 0
          exclusiveMinimum: true

    Trade:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        token_amount:
          type: number
        execution_price:
          type: number
        transaction_hash:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, failed]
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Redemptions
    # -------------------------------------------------------------------------
    RedemptionCreate:
      type: object
      required: [user_id, wallet_id, token_amount]
      properties:
        user_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        token_amount:
          type: number
          minimum: 0
          exclusiveMinimum: true

    Redemption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        token_amount:
          type: number
        compensation_amount:
          type: number
          nullable: true
        compensation_currency:
          type: string
          nullable: true
        transaction_hash:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, completed, rejected]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true